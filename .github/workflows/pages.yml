name: Test and publish Yu study
on:
  push:
    branches: [main, notebook-workbooks-v03, exam-print-v04, bulk-library-v05, library-companions-v06]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Install Korean fonts for rendered fixtures
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify Korean IME and live search in desktop Chromium
        run: node scripts/search-test.mjs
        env:
          YU_BROWSER: /usr/bin/google-chrome
      - name: Compare rendered workbooks with synthetic source PDFs in Chromium
        run: node scripts/workbook-test.mjs
        env:
          YU_BROWSER: /usr/bin/google-chrome
          YU_PROOF_DIR: ${{ runner.temp }}/workbook-proof
      - run: node scripts/browser-test.mjs
        env:
          YU_BROWSER: /usr/bin/google-chrome
      - run: node scripts/import-test.mjs
        env:
          YU_BROWSER: /usr/bin/google-chrome
      - run: npx playwright install --with-deps webkit
      - run: node scripts/import-test.mjs
        env:
          YU_TEST_ENGINE: webkit
      - run: node scripts/browser-test.mjs
        env:
          YU_TEST_ENGINE: webkit
      - name: Check out the previously deployed archive
        uses: actions/checkout@v4
        with:
          ref: b333720a2d2012adb9e41c75c361aeea33297d9f
          path: baseline-v041
      - name: Upgrade an installed v0.4.1 archive in Chromium and tablet WebKit
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" baseline-v041/node_modules
          npm --prefix baseline-v041 run build
          node scripts/browser-test.mjs
          YU_TEST_ENGINE=webkit node scripts/browser-test.mjs
        env:
          YU_BROWSER: /usr/bin/google-chrome
          YU_PREVIOUS_DIST: baseline-v041/dist
      - name: Verify tablet WebKit composition, editing and offline search
        run: node scripts/search-test.mjs
        env:
          YU_TEST_ENGINE: webkit
      - name: Verify workbook rendering and touch editing in WebKit
        run: node scripts/workbook-test.mjs
        env:
          YU_TEST_ENGINE: webkit
      - name: Import and resume mixed ZIP collections on Chromium and WebKit
        run: |
          node scripts/bulk-test.mjs
          YU_TEST_ENGINE=webkit node scripts/bulk-test.mjs
        env:
          YU_BROWSER: /usr/bin/google-chrome
      - name: Render scaled B4 papers and check final choices in both tablet engines
        run: |
          node scripts/print-proof.mjs
          YU_TEST_ENGINE=webkit node scripts/print-proof.mjs
        env:
          YU_BROWSER: /usr/bin/google-chrome
          YU_PROOF_DIR: ${{ runner.temp }}/workbook-proof
      - name: Save synthetic PDF render comparisons
        uses: actions/upload-artifact@v4
        with:
          name: workbook-render-comparison
          path: ${{ runner.temp }}/workbook-proof
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  companions:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts && npm run build
      - name: Verify linked PDFs and interrupted trash cleanup in Chromium
        run: node scripts/companion-test.mjs
        env:
          YU_BROWSER: /usr/bin/google-chrome
      - run: npx playwright install --with-deps webkit
      - name: Verify linked PDFs, offline positions and touch history in WebKit
        run: node scripts/companion-test.mjs
        env:
          YU_TEST_ENGINE: webkit
      - uses: actions/checkout@v4
        with:
          ref: b92366a1bffa94b6ea8c1784fb97dbcfeee0f255
          path: deployed-v051
      - name: Upgrade an installed v0.5.1 app with existing files, study and trash history
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" deployed-v051/node_modules
          npm --prefix deployed-v051 run build
          node scripts/browser-test.mjs
          YU_TEST_ENGINE=webkit node scripts/browser-test.mjs
        env:
          YU_BROWSER: /usr/bin/google-chrome
          YU_PREVIOUS_VERSION: 0.5.1
          YU_PREVIOUS_DIST: deployed-v051/dist
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts && npm run build
      - name: Measure metadata and mixed PDF collections up to 3000 originals
        run: node scripts/companion-bench.mjs
        env:
          YU_BROWSER: /usr/bin/google-chrome
      - uses: actions/checkout@v4
        with:
          ref: b92366a1bffa94b6ea8c1784fb97dbcfeee0f255
          path: baseline-v051
      - name: Compare the same illustrated library before and after the update
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" baseline-v051/node_modules
          npm --prefix baseline-v051 run build
          cd baseline-v051
          node scripts/library-bench.mjs
          cd ..
          node scripts/library-bench.mjs
        env:
          YU_BROWSER: /usr/bin/google-chrome
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, companions, performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node scripts/live-test.mjs
        env:
          YU_BROWSER: /usr/bin/google-chrome
          YU_LIVE_URL: ${{ steps.deployment.outputs.page_url }}
